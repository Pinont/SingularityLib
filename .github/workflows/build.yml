name: build-and-publish

on:
  push:
    branches: [ main, "rework/v2" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install annotation processor module
        # singularitylib-processor is a standalone module (the root pom is a jar,
        # not an aggregator), so install it into the local repo first — the lib
        # compiles against it via annotationProcessorPaths.
        run: mvn -q install -f singularitylib-processor/pom.xml
      - name: Build & test
        run: mvn -q clean package

  publish:
    # Snapshots to GitHub Packages on branch pushes only (PRs never publish).
    # NOTE: GH Packages rejects re-publishing existing RELEASE versions;
    # snapshots are always overwritable.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install annotation processor module
        run: mvn -q install -f singularitylib-processor/pom.xml
      - name: Publish snapshot (processor + lib)
        run: |
          mvn -q deploy -f singularitylib-processor/pom.xml -DskipTests
          mvn -q deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}

